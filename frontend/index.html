<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ShipAmaze</title>
    <meta
      name="description"
      content="ShipAmaze is an AI-powered shipping and dropshipping platform for managing orders, couriers, payouts, catalogues, and Shopify integrations."
    />
    <meta name="author" content="ShipAmaze" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShipAmaze" />
    <meta
      property="og:description"
      content="ShipAmaze is an AI-powered shipping and dropshipping platform for managing orders, couriers, payouts, catalogues, and Shopify integrations."
    />
    <meta property="og:image" content="/brand/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShipAmaze" />
    <meta
      name="twitter:description"
      content="ShipAmaze is an AI-powered shipping and dropshipping platform for managing orders, couriers, payouts, catalogues, and Shopify integrations."
    />
    <meta name="twitter:image" content="/brand/og-image.png" />
    <script>
      try {
        if (localStorage.getItem("shipflow_theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: hsl(210 40% 98%); }
      html.dark, html.dark body, html.dark #root { background: hsl(222 47% 8%); }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
